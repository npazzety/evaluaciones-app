<div class="dashboard-container">
  <aside class="sidebar-aside" [class.is-hidden]="!isSidebarVisible()">
    <div class="sidebar-fixed-content">
      <app-sidebar (toggleEvent)="toggleSidebar()"></app-sidebar>
    </div>
  </aside>

  <div class="main-wrapper" [class.with-floating-button]="!isSidebarVisible()">
    <button
      *ngIf="!isSidebarVisible()"
      (click)="toggleSidebar()"
      class="menu-toggle-btn floating"
    >
      <i class="fa-solid fa-bars"></i>
    </button>

    <main class="scrollable-content custom-scroll">
      <div class="page-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
