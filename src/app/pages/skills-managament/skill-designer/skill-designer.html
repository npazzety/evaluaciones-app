<div class="animate-in slide-in-from-bottom-6 duration-700">
  <div class="flex items-center justify-between mb-10">
    <h1 class="text-3xl font-black text-[#002855] tracking-tighter">Diseñar Evaluación</h1>
    <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-2xl border border-slate-100 shadow-sm">
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
      <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Editor Activo</span>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

    <div class="lg:col-span-8 bg-white rounded-[3rem] p-10 border border-slate-100 shadow-sm min-h-[600px]">
      <div class="flex justify-between items-center mb-10">
        <div>
          <h3 class="text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] mb-1">Competencias</h3>
          <p class="text-xs text-slate-500 font-bold">Selecciona las habilidades a evaluar</p>
        </div>
        <span class="bg-[#5d3fd3]/10 text-[#5d3fd3] text-[10px] font-black px-5 py-2 rounded-full uppercase">
          {{selectedCount()}} Seleccionadas
        </span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div *ngFor="let h of habilidades()"
             (click)="toggleHabilidad(h)"
             [class.border-[#002855]]="h.seleccionada"
             [class.bg-slate-50]="h.seleccionada"
             class="flex items-center p-6 rounded-[2rem] border-2 border-slate-50 hover:border-slate-200 transition-all cursor-pointer group relative overflow-hidden">

          <div [class.bg-[#002855]]="h.seleccionada"
               class="w-7 h-7 border-2 border-slate-200 rounded-xl flex items-center justify-center transition-all">
            <svg *ngIf="h.seleccionada" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <span class="ml-5 font-bold text-[#002855] group-hover:translate-x-1 transition-transform">{{h.nombre}}</span>
        </div>
      </div>
    </div>

    <div class="lg:col-span-4 space-y-8">

      <div class="bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-sm">
        <h3 class="text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] mb-8">Programación</h3>
        <div class="space-y-6">
          <div class="group">
            <label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-2 block">Fecha de Inicio</label>
            <div class="relative">
              <input type="date" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-xs font-bold text-slate-700 focus:ring-2 focus:ring-[#002855]/5">
            </div>
          </div>
          <div class="group">
            <label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-2 block">Hora de Apertura</label>
            <input type="time" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-xs font-bold text-slate-700 focus:ring-2 focus:ring-[#002855]/5">
          </div>
        </div>
      </div>

      <div class="bg-white rounded-[3rem] p-10 border border-slate-100 shadow-sm text-center relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-[#f01a5d]/5 rounded-full blur-3xl"></div>
        <span class="text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] block mb-4">Total Ponderación</span>
        <div class="text-[80px] leading-none font-black text-[#002855] mb-10 tracking-tighter">
          {{totalWeight()}}<span class="text-2xl text-slate-300">%</span>
        </div>

        <button (click)="sugerirPesosIA()"
                class="w-full bg-[#f01a5d] text-white py-5 rounded-[2rem] font-black text-[11px] uppercase tracking-widest shadow-[0_15px_30px_rgba(240,26,93,0.3)] hover:scale-[1.03] active:scale-95 transition-all flex items-center justify-center gap-3">
          <span class="text-lg">✨</span> Sugerir con IA
        </button>
      </div>
    </div>
  </div>

  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 lg:left-auto lg:right-10 lg:translate-x-0 z-[100]">
    <div class="bg-white/90 backdrop-blur-xl p-2 rounded-[2.5rem] shadow-[0_30px_60px_rgba(0,0,0,0.1)] border border-white/50 flex gap-3">
      <button routerLink=".."
              class="px-8 py-4 rounded-[1.8rem] font-black text-[11px] uppercase tracking-widest text-slate-400 hover:text-[#002855] hover:bg-slate-50 transition-all">
        Cancelar
      </button>
      <button [disabled]="totalWeight() !== 100"
              class="bg-[#002855] text-white px-10 py-4 rounded-[1.8rem] font-black text-[11px] uppercase tracking-widest hover:shadow-xl hover:shadow-[#002855]/20 disabled:opacity-30 disabled:grayscale transition-all">
        Publicar Evaluación
      </button>
    </div>
  </div>
</div>
