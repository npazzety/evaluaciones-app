<app-portal-header title="Gestión de Habilidades"></app-portal-header>

<div class="p-6 bg-slate-50 min-h-screen">
  <div class="max-w-6xl mx-auto">

    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Panel de Control</h1>
      <button (click)="modoFormulario.set(!modoFormulario())" class="btn btn-outline border-slate-300">
        {{ modoFormulario() ? 'Cancelar' : 'Nueva Evaluación' }}
      </button>
    </div>

    <app-evaluation-designer
  *ngIf="modoFormulario()"
  [skills]="habilidades()"
  [totalWeight]="totalWeight()"
  [selectedCount]="selectedCount()"
  [fecha]="fecha()"
  [hora]="hora()"
  (fechaChange)="fecha.set($event)"
  (horaChange)="hora.set($event)"
  (onIAAdjust)="sugerirPesosIA()"
  (onPublish)="guardarEvaluacion()"
  (onSkillUpdate)="actualizarHabilidades()"> </app-evaluation-designer>

    <div *ngIf="!modoFormulario()" class="hero bg-white rounded-3xl border border-slate-100 shadow-sm py-20">
      <div class="hero-content text-center">
        <div class="max-w-md">
          <p class="text-5xl mb-4 text-slate-300">📋</p>
          <h2 class="text-xl font-bold text-slate-600">No hay evaluaciones activas</h2>
          <p class="py-4 text-slate-400 text-sm">Comienza diseñando una nueva evaluación para tu equipo de trabajo.</p>
        </div>
      </div>
    </div>

  </div>
</div>
