<div class="evaluation-portal p-4 sm:p-8 min-h-screen bg-slate-50">

  <app-portal-header title="Gestión de Habilidades"></app-portal-header>

  <div class="mt-6">

    <div *ngIf="isMainRoute()" class="animate-in fade-in duration-500">
      <div class="mb-8">
        <h1 class="text-2xl sm:text-3xl font-black text-[#002855] tracking-tight">Panel de Control</h1>
      </div>

      <div class="bg-white rounded-[3rem] border border-slate-100 shadow-sm py-24 flex flex-col items-center justify-center">
        <div class="text-center px-4">
          <p class="text-6xl mb-6 grayscale opacity-30">📋</p>
          <h2 class="text-xl font-bold text-slate-700 uppercase tracking-tighter">No hay evaluaciones activas</h2>
          <p class="py-4 text-slate-400 text-sm max-w-xs mx-auto leading-relaxed">
            Comienza diseñando una nueva evaluación para tu equipo de trabajo pulsando el botón de abajo.
          </p>
        </div>
      </div>

      <div class="fixed bottom-8 right-8 z-50">
  <div class="bg-transparent backdrop-blur-md p-2 rounded-2xl border border-slate-200/0">
    <button routerLink="nuevo"
            class="bg-[#002855] text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest
                   hover:scale-105 active:scale-95 transition-all flex items-center gap-2
                   shadow-2xl shadow-[#002855]/40"> <span class="text-lg">+</span> NUEVA EVALUACIÓN
    </button>
  </div>
</div>
    </div>

    <router-outlet></router-outlet>

  </div>
</div>
