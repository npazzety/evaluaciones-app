<app-portal-header title="Gestión de Habilidades"></app-portal-header>

<div class="p-4 sm:p-6 bg-slate-50 min-h-screen">
  <div class="max-w-6xl mx-auto">

    <div class="flex flex-col xs:flex-row justify-between items-start xs:items-center mb-6 sm:mb-8 gap-4">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">
        Panel de Control
      </h1>

      <button (click)="modoFormulario.set(!modoFormulario())"
              class="btn btn-outline border-slate-300 w-full xs:w-auto h-12 min-h-0 text-sm font-bold">
        {{ modoFormulario() ? 'Cancelar' : 'Nueva Evaluación' }}
      </button>
    </div>

    <app-evaluation-designer
      *ngIf="modoFormulario()"
      [skills]="habilidades()"
      [totalWeight]="totalWeight()"
      [selectedCount]="selectedCount()"
      [fecha]="fecha()"
      [hora]="hora()"
      (fechaChange)="fecha.set($event)"
      (horaChange)="hora.set($event)"
      (onIAAdjust)="sugerirPesosIA()"
      (onPublish)="guardarEvaluacion()"
      (onSkillUpdate)="actualizarHabilidades()">
    </app-evaluation-designer>

    <div *ngIf="!modoFormulario()"
         class="hero bg-white rounded-2xl sm:rounded-3xl border border-slate-100 shadow-sm py-12 sm:py-20 animate-in fade-in slide-in-from-bottom-4">
      <div class="hero-content text-center px-4">
        <div class="max-w-md">
          <p class="text-4xl sm:text-5xl mb-4 text-slate-300">📋</p>
          <h2 class="text-lg sm:text-xl font-bold text-slate-600">No hay evaluaciones activas</h2>
          <p class="py-3 sm:py-4 text-slate-400 text-xs sm:text-sm leading-relaxed">
            Comienza diseñando una nueva evaluación para tu equipo de trabajo.
          </p>
        </div>
      </div>
    </div>

  </div>
</div>
