<div class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-700">

  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm gap-4">
    <div class="flex items-center gap-4">
      <div class="bg-green-50 p-4 rounded-2xl">
        <div class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
        </div>
      </div>
      <div>
        <h2 class="text-2xl font-black text-[#002855] uppercase tracking-tighter">Ciclo 2025 - 2026</h2>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Historial de Rendimiento</p>
      </div>
    </div>

    <button (click)="descargarPDF()"
            class="bg-slate-50 text-[#002855] px-6 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-[#002855] hover:text-white transition-all flex items-center gap-3 border border-slate-100">
      <i class="fa-solid fa-cloud-arrow-down text-base"></i>
      Descargar Reporte Full
    </button>
  </div>

  <div class="bg-white rounded-[3rem] border border-slate-100 shadow-sm overflow-hidden">

    <div class="grid grid-cols-12 gap-4 p-6 bg-slate-50/50 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 border-b border-slate-100">
      <div class="col-span-5 pl-6">Competencia</div>
      <div class="col-span-2 text-center">Auto</div>
      <div class="col-span-2 text-center">Jefe</div>
      <div class="col-span-3 text-center">Acciones</div>
    </div>

    <div *ngFor="let item of datosHistorial()"
         class="grid grid-cols-12 gap-4 p-6 items-center border-b border-slate-50 hover:bg-slate-50/50 transition-all group">

      <div class="col-span-5 flex items-center gap-5">
        <div class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-50 text-[#002855] group-hover:bg-[#002855] group-hover:text-white transition-all">
          <i class="fa-solid {{item.icono}} text-lg"></i>
        </div>
        <div>
          <p class="font-black text-[#002855] text-sm tracking-tight">{{item.habilidad}}</p>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{{item.fecha}}</p>
        </div>
      </div>

      <div class="col-span-2 text-center">
        <div class="inline-block px-4 py-2 bg-slate-50 rounded-xl">
          <span class="font-black text-[#002855] text-base">{{item.miNota}}</span>
        </div>
      </div>

      <div class="col-span-2 text-center">
        <div class="inline-block px-4 py-2 rounded-xl"
             [ngClass]="item.notaJefe >= item.miNota ? 'bg-green-50' : 'bg-orange-50'">
          <span class="font-black text-lg"
                [ngClass]="item.notaJefe >= item.miNota ? 'text-green-600' : 'text-orange-500'">
            {{item.notaJefe}}
          </span>
        </div>
      </div>

      <div class="col-span-3 flex justify-center gap-3">
        <button class="bg-white border border-slate-100 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-[#002855] hover:border-[#002855] transition-all">
          Detalles
        </button>
        <button class="w-10 h-10 flex items-center justify-center bg-red-50 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-sm">
          <i class="fa-solid fa-file-pdf"></i>
        </button>
      </div>
    </div>
  </div>
</div>
