<div class="max-w-5xl mx-auto py-6">
  <div class="flex items-center gap-2 sm:gap-4 mb-6 sm:mb-10 px-2 sm:px-0">
    <button (click)="cancelar()" class="btn btn-circle btn-ghost btn-sm sm:btn-md">
      <i class="fa-solid fa-chevron-left text-lg"></i>
    </button>
    <div>
      <h2 class="text-xl sm:text-2xl font-black italic text-[#002855] leading-tight">
        Mi Autopercepción
      </h2>
      <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Bloque #{{evalId}}</p>
    </div>
  </div>

  <div class="grid gap-3 sm:gap-4 max-w-4xl mx-auto px-1">
    @for (hab of habilidades; track hab.id) {
      <app-skill-rating-card [habilidad]="hab"></app-skill-rating-card>
    }

    <div class="flex flex-col-reverse sm:flex-row justify-end items-center gap-4 pt-8 sm:pt-10 pb-6">
      <button class="btn btn-ghost font-bold text-gray-400 w-full sm:w-auto"
              (click)="cancelar()">
        Cancelar
      </button>

      <button class="btn bg-[#002855] hover:bg-[#001a38] w-full sm:btn-wide shadow-2xl text-white font-black rounded-full border-none h-14 sm:h-16 text-sm sm:text-base active:scale-95 transition-transform"
              (click)="enviar()">
        Finalizar y Enviar
      </button>
    </div>
  </div>
</div>
