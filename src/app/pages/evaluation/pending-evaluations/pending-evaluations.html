<div class="flex flex-col space-y-6">

  <h2 class="text-2xl font-black text-[#002855] px-2">Mis Evaluaciones Pendientes</h2>

  <div class="grid grid-cols-1 gap-4">
    <div *ngFor="let item of [1,2,3,4,5,6]"
         class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 hover:shadow-md transition-all">

      <div class="flex items-start gap-4">
        <div class="w-1 bg-purple-600 h-16 rounded-full"></div>

        <div>
          <span class="badge badge-secondary badge-sm font-bold mb-2">Disponible</span>
          <h3 class="font-black text-slate-800 text-lg">
            Evaluación Anual de Competencias 2026 - Bloque {{item}}
          </h3>
          <p class="text-slate-400 text-xs">Habilidades blandas y conocimientos técnicos de área.</p>

          <div class="flex gap-4 mt-2 text-slate-400 text-[10px] font-bold">
            <span><i class="fa-regular fa-calendar-days mr-1"></i> 2026-01-13</span>
            <span><i class="fa-regular fa-clock mr-1"></i> 09:00</span>
          </div>
        </div>
      </div>

      <a [routerLink]="['../form', item]"
         class="btn bg-indigo-600 hover:bg-indigo-700 text-white border-none px-8 rounded-xl font-bold transition-transform active:scale-95 no-underline flex items-center justify-center">
        Comenzar ahora
      </a>

    </div>
  </div>
</div>
