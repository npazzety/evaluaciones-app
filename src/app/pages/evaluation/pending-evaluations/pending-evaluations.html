<div class="p-6">
  <h1 class="text-2xl font-bold mb-6">Mis Evaluaciones Pendientes</h1>

  <div *ngFor="let eval of evaluacionesDisponibles()" class="card bg-white border-l-8 border-primary shadow-lg p-6 flex flex-row justify-between items-center">
    <div>
      <div class="badge badge-secondary mb-2">Disponible</div>
      <h3 class="text-xl font-bold">{{ eval.titulo }}</h3>
      <p class="text-gray-500">{{ eval.descripcion }}</p>
      <div class="flex gap-4 mt-2 text-sm text-gray-400">
        <span>📅 {{ eval.fecha }}</span>
        <span>⏰ {{ eval.hora }}</span>
      </div>
    </div>

    <button (click)="entrarAEvaluar()" class="btn btn-primary btn-lg">
      Comenzar ahora
    </button>
  </div>
</div>
