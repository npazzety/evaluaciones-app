<div class="max-w-6xl mx-auto flex flex-col space-y-8 p-6 animate-in fade-in duration-700">

  <app-portal-header></app-portal-header>

  <div role="tablist" class="tabs tabs-lifted tabs-lg w-full">

    <input type="radio" name="tabs_eval" role="tab" class="tab font-bold text-[#1a3a0a]" aria-label="Nueva Evaluación" checked />
    <div role="tabpanel" class="tab-content bg-slate-50/30 border-slate-200 rounded-[2.5rem] p-4 md:p-8 min-h-[500px]">

      <ng-container *ngIf="accesoPermitido() && !evaluacionSeleccionada()">
        <div class="flex justify-between items-center mb-8 px-4">
          <h2 class="text-2xl font-black text-[#1a3a0a]">Evaluaciones Pendientes</h2>
        </div>

        <div class="card bg-white border border-slate-100 hover:border-green-200 shadow-sm hover:shadow-xl transition-all cursor-pointer rounded-[2.5rem]"
             (click)="abrirEvaluacion()">
          <div class="card-body flex-col md:flex-row justify-between items-center p-8">
            <div class="flex items-center gap-6">
              <div class="bg-orange-50 text-orange-600 p-5 rounded-2xl shadow-inner">
                <i class="fa-solid fa-file-signature text-3xl"></i>
              </div>
              <div>
                <h4 class="text-xl font-black text-slate-800">Autoevaluación de Desempeño 2026</h4>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-1">Periodo Actual • Feedback Continuo</p>
              </div>
            </div>
            <button class="btn bg-[#1a3a0a] hover:bg-[#122907] text-white rounded-full px-10 border-none h-14 shadow-lg normal-case">
              Comenzar
            </button>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="evaluacionSeleccionada()">
        <div class="flex items-center gap-4 mb-8 px-4">
          <button (click)="cancelar()" class="btn btn-circle btn-ghost text-slate-400 hover:text-[#e91e63]">
            <i class="fa-solid fa-chevron-left text-xl"></i>
          </button>
          <h2 class="text-3xl font-black text-[#1a3a0a] tracking-tight">Mi Autopercepción</h2>
        </div>

        <div class="card bg-white shadow-2xl shadow-slate-200/50 rounded-[2.5rem] border border-slate-100 overflow-hidden max-w-4xl mx-auto">

          <div class="overflow-y-auto custom-scrollbar p-6" style="height: 400px;">
            <div class="grid gap-3">
              @for (hab of habilidadesActivas(); track hab.id) {
                <app-skill-rating-card [habilidad]="hab"></app-skill-rating-card>
              }
            </div>
          </div>

          <div class="p-6 bg-slate-50 border-t border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <span class="text-[10px] font-bold text-slate-400 uppercase px-4">Asegúrese de calificar todos los criterios antes de enviar</span>
            <div class="flex gap-4">
              <button class="btn btn-ghost font-bold text-slate-400 normal-case" (click)="cancelar()">Cancelar</button>
              <button class="btn bg-[#1a3a0a] hover:bg-[#122907] text-white font-black rounded-full border-none px-12 h-14 shadow-xl text-lg normal-case"
                      (click)="enviarEvaluacion()">
                Finalizar y Enviar
              </button>
            </div>
          </div>
        </div>
      </ng-container>

    </div>

    <input type="radio" name="tabs_eval" role="tab" class="tab font-bold" aria-label="Mi Historial" />
    <div role="tabpanel" class="tab-content bg-white border-slate-200 rounded-[2.5rem] p-10 shadow-xl">
      <app-history-table></app-history-table>
    </div>

  </div>
</div>
