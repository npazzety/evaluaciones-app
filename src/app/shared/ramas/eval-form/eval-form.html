<div class="max-w-2xl mx-auto bg-white p-6 sm:p-10 rounded-[1.5rem] sm:rounded-[3rem] border border-gray-100 shadow-2xl">
  <div class="space-y-6 sm:space-y-8">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-8">

      <div class="form-control">
        <label class="label font-bold text-[#002855] text-[10px] sm:text-xs uppercase tracking-widest px-2 sm:px-4">
          Fecha de Inicio
        </label>
        <input type="date"
               [(ngModel)]="nuevaConfig.fechaInicio"
               class="input input-bordered input-md sm:input-lg focus:border-[#002855] rounded-xl sm:rounded-2xl bg-gray-50 w-full" />
      </div>

      <div class="form-control">
        <label class="label font-bold text-[#002855] text-[10px] sm:text-xs uppercase tracking-widest px-2 sm:px-4">
          Hora de Inicio
        </label>
        <input type="time"
               [(ngModel)]="nuevaConfig.horaInicio"
               class="input input-bordered input-md sm:input-lg focus:border-[#002855] rounded-xl sm:rounded-2xl bg-gray-50 w-full" />
      </div>

    </div>

    <button (click)="submit()"
            class="btn bg-[#002855] hover:bg-[#001a38] btn-block btn-md sm:btn-lg text-white font-black shadow-xl rounded-full border-none h-12 sm:h-16 text-sm sm:text-base">
      PROGRAMAR AHORA
    </button>

  </div>
</div>
