<div class="flex flex-col items-center justify-center py-12 sm:py-20 text-center space-y-6 animate-in fade-in zoom-in duration-500 px-4">

  <div class="bg-gray-50 p-6 sm:p-10 rounded-full text-[#002855] shadow-inner">
    <i class="fa-solid fa-hourglass-half text-4xl sm:text-6xl animate-pulse"></i>
  </div>

  <div class="px-2">
    <h3 class="text-2xl sm:text-3xl font-black text-[#002855] tracking-tight">
      Acceso no habilitado
    </h3>

    <p class="text-gray-400 max-w-xs sm:max-w-md mx-auto mt-2 text-sm sm:text-base font-medium italic">
      {{ mensaje }}
    </p>
  </div>

  <button class="btn btn-ghost text-[#002855] font-bold h-12 sm:h-auto px-6 sm:px-4" (click)="onRefresh.emit()">
    <i class="fa-solid fa-rotate-right mr-2"></i>
    Actualizar estado
  </button>
</div>
