<div class="card bg-white p-5 border border-slate-100 shadow-sm rounded-2xl relative overflow-hidden">
  <div class="absolute top-0 right-0 w-24 h-24 bg-slate-50 rounded-full -mr-10 -mt-10 opacity-50"></div>

  <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">Ponderación Actual</p>

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-5xl font-black text-[#1a3a0a] tracking-tighter">
      {{ total }}<span class="text-2xl ml-1">%</span>
    </h2>
    <div *ngIf="total === 100" class="badge bg-green-100 text-green-800 border-none font-bold p-3">🎯 LISTO</div>
  </div>

  <button (click)="onSuggestIA.emit()"
          class="btn border-none normal-case text-white bg-[#e91e63] hover:bg-[#c2185b] rounded-full w-full gap-2 shadow-lg shadow-pink-100">
    ✨ Sugerir Pesos (IA)
  </button>
</div>
