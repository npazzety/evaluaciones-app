<div class="card bg-white p-4 sm:p-6 border border-slate-100 shadow-sm rounded-2xl relative overflow-hidden">
  <div class="hidden xs:block absolute top-0 right-0 w-24 h-24 bg-slate-50 rounded-full -mr-10 -mt-10 opacity-50"></div>

  <p class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1 relative z-10">
    Ponderación Actual
  </p>

  <div class="flex flex-col xs:flex-row justify-between items-start xs:items-center mb-4 gap-2 relative z-10">
    <h2 class="text-4xl sm:text-5xl font-black text-[#1a3a0a] tracking-tighter">
      {{ total }}<span class="text-xl sm:text-2xl ml-1">%</span>
    </h2>

    <div *ngIf="total === 100"
         class="badge bg-green-100 text-green-800 border-none font-bold p-2 sm:p-3 text-xs sm:text-sm">
      🎯 LISTO
    </div>
  </div>

  <button (click)="onSuggestIA.emit()"
          class="btn border-none normal-case text-white bg-[#e91e63] hover:bg-[#c2185b] rounded-full w-full gap-2 shadow-lg shadow-pink-100 py-2 sm:py-3 h-auto min-h-0 text-sm sm:text-base">
    ✨ <span class="hidden xs:inline">Sugerir Pesos (IA)</span>
       <span class="xs:hidden">Sugerir con IA</span>
  </button>
</div>
