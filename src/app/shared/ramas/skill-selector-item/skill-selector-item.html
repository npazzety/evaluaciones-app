<div class="p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6 transition-all border-b border-slate-50 hover:bg-blue-50/30"
     [ngClass]="{'bg-blue-50/50 border-l-4 border-l-primary': skill.seleccionada}">

  <div class="flex items-center gap-4 flex-1">
    <input type="checkbox" [(ngModel)]="skill.seleccionada" (change)="onToggle()"
           class="checkbox checkbox-primary checkbox-sm sm:checkbox-md" />

    <p class="font-bold text-sm sm:text-base text-slate-700" [class.text-primary]="skill.seleccionada">
      {{ skill.nombre }}
    </p>
  </div>

  <div *ngIf="skill.seleccionada"
       class="w-full sm:flex-1 mt-1 sm:mt-0 flex items-center gap-3 sm:gap-4 animate-in fade-in slide-in-from-left-2">

       <input type="range" min="0" max="100" step="5" [(ngModel)]="skill.ponderacion"
              (input)="changed.emit()"
              class="range range-xs range-primary flex-1" />

       <div class="min-w-[50px] sm:w-16 text-right">
         <span class="text-base sm:text-lg font-black text-primary">{{ skill.ponderacion }}%</span>
       </div>
  </div>
</div>
