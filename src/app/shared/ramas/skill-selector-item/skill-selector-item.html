<div class="p-4 flex items-center gap-6 transition-all border-b border-slate-50 hover:bg-blue-50/30"
     [ngClass]="{'bg-blue-50/50 border-l-4 border-l-primary': skill.seleccionada}">

  <input type="checkbox" [(ngModel)]="skill.seleccionada" (change)="onToggle()"
         class="checkbox checkbox-primary checkbox-md" />

  <div class="flex-1">
    <p class="font-bold text-slate-700" [class.text-primary]="skill.seleccionada">
      {{ skill.nombre }}
    </p>

    <div *ngIf="skill.seleccionada" class="mt-3 flex items-center gap-4 animate-in fade-in slide-in-from-left-2">
       <input type="range" min="0" max="100" step="5" [(ngModel)]="skill.ponderacion"
              (input)="changed.emit()" class="range range-xs range-primary flex-1" />
       <div class="w-16 text-right">
         <span class="text-lg font-black text-primary">{{ skill.ponderacion }}%</span>
       </div>
    </div>
  </div>
</div>
