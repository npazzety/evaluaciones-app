<div class="group flex flex-col p-5 mb-3 rounded-[2rem] border-2 transition-all duration-300"
     [ngClass]="skill.seleccionada
                ? 'bg-white border-[#002855] shadow-[0_15px_30px_rgba(0,40,85,0.08)]'
                : 'bg-white border-slate-50 hover:border-slate-200'">

  <div class="flex items-center gap-4 w-full">
    <div class="relative flex items-center">
      <input type="checkbox" [(ngModel)]="skill.seleccionada" (change)="onToggle()"
             class="w-6 h-6 rounded-xl border-2 border-slate-200 text-[#002855] focus:ring-0 transition-all checked:bg-[#002855] appearance-none cursor-pointer" />
      <span *ngIf="skill.seleccionada" class="absolute pointer-events-none left-1.5 text-white text-[10px]">✓</span>
    </div>

    <div class="flex flex-col flex-1">
      <p class="font-black text-sm tracking-tight transition-colors"
         [class.text-[#002855]]="skill.seleccionada"
         [class.text-slate-600]="!skill.seleccionada">
        {{ skill.nombre }}
      </p>
      <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Competencia Técnica</span>
    </div>

    <div *ngIf="skill.seleccionada" class="bg-slate-50 px-3 py-1 rounded-full">
       <span class="text-xs font-black text-[#002855]">{{ skill.ponderacion }}%</span>
    </div>
  </div>

  <div *ngIf="skill.seleccionada"
       class="mt-6 pt-4 border-t border-slate-50 flex items-center gap-6 animate-in slide-in-from-top-2 duration-300">

    <div class="flex-1 flex flex-col gap-2">
      <div class="flex justify-between items-center px-1">
        <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Ajustar Peso</span>
      </div>
      <input type="range" min="0" max="100" step="5" [(ngModel)]="skill.ponderacion"
             (input)="changed.emit()"
             class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-[#002855]" />
    </div>

    <div class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center border border-slate-100">
      <span class="text-sm font-black text-[#002855]">{{ skill.ponderacion }}</span>
    </div>
  </div>
</div>
