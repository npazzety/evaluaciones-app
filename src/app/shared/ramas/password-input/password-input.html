<div class="relative w-full">
  <app-input
    label="Contraseña"
    [type]="passwordVisible ? 'text' : 'password'"
    placeholder="••••••••"
    [control]="control"
    errorMessage="Mínimo 4 caracteres"
    class="w-full">
  </app-input>

  <button
    type="button"
    class="absolute right-3 sm:right-6 bottom-3 sm:bottom-5
           w-10 h-10 flex items-center justify-center
           text-gray-400 hover:text-[#002855]
           cursor-pointer transition-all text-lg sm:text-xl
           active:scale-95 touch-none"
    (mousedown)="passwordVisible = true"
    (mouseup)="passwordVisible = false"
    (mouseleave)="passwordVisible = false"
    (touchstart)="passwordVisible = true; $event.preventDefault()"
    (touchend)="passwordVisible = false">

    @if (passwordVisible) {
      <i class="fa-solid fa-eye"></i>
    } @else {
      <i class="fa-solid fa-eye-slash"></i>
    }

  </button>
</div>
