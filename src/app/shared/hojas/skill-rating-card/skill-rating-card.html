<div class="card bg-white border border-gray-100 shadow-sm rounded-[1.5rem] sm:rounded-[2rem] overflow-hidden mb-6 sm:mb-8">
  <div class="card-body p-5 sm:p-8">

    <div class="flex flex-row justify-between items-center mb-6 sm:mb-8 gap-2">
      <div class="flex gap-3 sm:gap-4 items-center">
        <div class="bg-[#002855] text-white rounded-xl sm:rounded-2xl w-10 h-10 sm:w-14 sm:h-14 shadow-lg flex items-center justify-center font-black text-lg sm:text-xl shrink-0">
          {{ habilidad.nombre.charAt(0) }}
        </div>
        <div class="min-w-0"> <h3 class="text-lg sm:text-xl font-bold text-gray-800 truncate">{{ habilidad.nombre }}</h3>
          <div class="badge bg-gray-100 text-[#002855] border-none text-[9px] sm:text-[10px] font-black uppercase tracking-widest">
            {{ habilidad.tipo }}
          </div>
        </div>
      </div>

      <div class="text-4xl sm:text-6xl font-black text-[#002855] tabular-nums tracking-tighter shrink-0">
        {{ habilidad.nota }}
      </div>
    </div>

    <div class="w-full relative px-1">
      <input type="range" min="0" max="10" step="1" [(ngModel)]="habilidad.nota"
             class="range [--range-shdw:#002855] range-primary range-md sm:range-lg w-full cursor-pointer" />
