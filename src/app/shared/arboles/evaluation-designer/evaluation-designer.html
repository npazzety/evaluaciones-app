<div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 items-start animate-in fade-in duration-500 px-2 sm:px-0">

  <div class="lg:col-span-8 order-2 lg:order-1">
    <div class="card bg-white shadow-sm border border-slate-200 flex flex-col overflow-hidden rounded-2xl sm:rounded-3xl">

      <div class="bg-slate-50 p-4 border-b shrink-0 flex justify-between items-center">
        <span class="font-bold text-slate-600 uppercase text-[10px] sm:text-xs tracking-widest">Listado de Competencias</span>
        <span class="badge badge-primary font-bold text-xs">{{ selectedCount }} seleccionadas</span>
      </div>

      <div class="overflow-y-auto custom-scrollbar h-[300px] sm:h-[370px]">
        <app-skill-list-container
          [skills]="skills"
          [selectedCount]="selectedCount"
          (onUpdate)="onSkillUpdate.emit()">
        </app-skill-list-container>
      </div>
    </div>
  </div>

  <div class="lg:col-span-4 lg:sticky lg:top-6 space-y-4 order-1 lg:order-2">

    <app-schedule-form
      [fecha]="fecha"
      [hora]="hora"
      (fechaChange)="fechaChange.emit($event)"
      (horaChange)="horaChange.emit($event)">
    </app-schedule-form>

    <app-weight-card
      [total]="totalWeight"
      (onSuggestIA)="onIAAdjust.emit()">
    </app-weight-card>

    <div class="card bg-white p-2 shadow-sm border border-slate-100 rounded-2xl">
      <button
        (click)="onPublish.emit()"
        [disabled]="!isReadyToPublish"
        class="btn btn-primary w-full btn-md sm:btn-lg shadow-md hover:brightness-110 transition-all disabled:opacity-30 disabled:grayscale font-black">
        Publicar Evaluación
      </button>
    </div>

  </div>

</div>
