<div class="sidebar-inner">
  <div class="sidebar-header">
    <div class="brand">
      <span class="brand-main">Espresso</span><span class="brand-sub">Eval</span>
    </div>

    <button (click)="emitToggle()" class="close-btn" type="button">
      <i class="fa-solid fa-bars-staggered"></i>
    </button>
  </div>

  <nav class="nav-menu">
    <ul class="nav-list">
      <li>
        <a routerLink="/dashboard/evaluacion" routerLinkActive="active" class="nav-link">
          <i class="fa-solid fa-clipboard-check"></i>
          <span>Mis Evaluaciones</span>
        </a>
      </li>

      <li *ngIf="emailUsuario === 'jefe@test.com'">
        <a routerLink="/dashboard/gestion" routerLinkActive="active" class="nav-link">
          <i class="fa-solid fa-gears"></i>
          <span>Gestión de Habilidades</span>
        </a>
      </li>

      <div class="spacer"></div>

      <li>
        <a routerLink="/dashboard/profile" routerLinkActive="active" class="nav-link">
          <i class="fa-solid fa-user-circle"></i>
          <span>Mi Perfil</span>
        </a>
      </li>

      <hr class="nav-divider">

      <li>
        <button (click)="logout()" class="logout-btn" type="button">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Cerrar Sesión</span>
        </button>
      </li>
    </ul>
  </nav>
</div>
